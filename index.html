<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECO BILL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            padding: 1rem;
            text-align: center;
            max-width: 400px;
            color: #252525;

            form {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                
                input, button {
                    font-size: 1rem;
                    padding: 0.8rem 1rem;
                    border-radius: 0.5rem;
                    border: 1px solid gray;
                }

                button {
                    background-color: #252525;
                    color: white;
                    cursor: pointer;
                }

                .error {
                    color: rgb(255, 73, 73);
                }
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Get you current MECO electric bill</h1>
        <form onsubmit="getBill(event)">
            <input type="number" id="acount_number" required placeholder="Account Number">
            <input type="text" id="last_name" required placeholder="Last name">
            <button>Download Bill</button>
            <div class="error"></div>
        </form>
    </div>

    
    <script>

        const accountNumber = document.getElementById('account_number')
        const lastName = document.getElementById('last_name')
        const error = document.querySelector('.error')

        async function getBill(e) {
            e.preventDefault()
            error.innerText = ""

            const [{value: acc}, {value: lname}] = e.target

            if(lname.trim() === ''){
                error.innerText = "Fields cannot be empty"
                return  
            }

            try {
                const res = await fetch(`${process.env.BILLING_BASE_URL}/0/${acc}/${lname.trim()}?`)
                const data = await res.text()

                const errorMessage = data.includes('alert') && data.slice(data.indexOf('alert') + 7).slice(0, data.slice(data.indexOf('alert') + 7).indexOf('"'))
                
                if(errorMessage) {
                    error.innerText = errorMessage
                    return
                }

                const frame = data.slice(data.indexOf('<iframe'), data.indexOf('</iframe>') - 2)
                const src = frame.slice(frame.indexOf('src') + 5)
                const url = src.slice(src.indexOf('url') + 4)
    
                const a = document.createElement('a')
                a.href = url
                a.click()
            } catch(err) {
                console.log(err)
            }
        }
    </script>
</body>
</html>
