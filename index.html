<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MECO BILL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            padding: 1rem;
            text-align: center;
            max-width: 400px;
            color: #252525;

            form {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                
                input, button {
                    font-size: 1rem;
                    padding: 0.8rem 1rem;
                    border-radius: 0.5rem;
                    border: 1px solid gray;
                }

                button {
                    background-color: #252525;
                    color: white;
                    cursor: pointer;

                    &:disabled {
                        opacity: 0.8;
                    }
                }

                .error {
                    color: rgb(255, 73, 73);
                }
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Get you current MECO electric bill</h1>
        <form onsubmit="getBill(event)">
            <input type="number" id="acount_number" required placeholder="Account Number">
            <input type="text" id="last_name" required placeholder="Last name">
            <button id="download_btn">Download Bill</button>
            <div class="error"></div>
        </form>
    </div>

    <script>

        const accountNumber = document.getElementById('account_number')
        const lastName = document.getElementById('last_name')
        const downloadBtn = document.getElementById('download_btn')
        const error = document.querySelector('.error')

        async function getBill(e) {
            e.preventDefault()

            error.innerText = ""

            downloadBtn.disabled = true
            downloadBtn.innerText = "Downloading..."

            try {
                const [{ value: acc}, { value: lname }] = e.target

                const res = await fetch('https://getbillingbase-usftn65rrq-uc.a.run.app', {
                    method: 'POST',
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        acc: acc, 
                        lname: lname
                    })
                })
                const data = await res.json()

                if(data.error) {
                    error.innerText = data.error
                    return
                }

                download(data.url)
            } catch(err) {
                error.innerText = err
            } finally {
                downloadBtn.disabled = false
                downloadBtn.innerText = "Download Bill"
            }
        }

        function download(url) {
            const a = document.createElement('a')
            a.href = url.replace('http', 'https')
            a.click()
        }
    </script>
</body>
</html>
