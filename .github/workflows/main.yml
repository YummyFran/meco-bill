name: Deploy Workflow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Inject Secret into JavaScript
        run: |
          echo "window.ENV = { BILLING_BASE_URL: '${{ secrets.BILLING_BASE_URL }}' };" > public/env.js

      - name: Deploy to GitHub Pages (example)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
